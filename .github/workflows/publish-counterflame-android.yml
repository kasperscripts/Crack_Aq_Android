name: Verify and publish CounterFlame Android
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Temporary direct URL of the original APK
        type: string
        required: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Download and verify the original APK
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          mkdir -p work
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil,urllib.request
          url=os.environ['SOURCE_URL'];print('::add-mask::'+url,flush=True)
          p=Path('work/original.apk')
          with urllib.request.urlopen(url,timeout=240) as r,p.open('wb') as f:shutil.copyfileobj(r,f,16*1024*1024)
          expected=json.loads(Path('counterflame_android/source-verification.json').read_text())
          assert p.stat().st_size==expected['size']
          with p.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==expected['sha256']
          PY
      - name: Reconstruct the exact signed APK
        run: |
          python3 apply_delta.py work/original.apk artifacts/counterflame-android-v1.patch work/CounterFlame_Icon_Crack.apk
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('work/original.apk') as z:Path('counterflame_android/cf.bin').write_bytes(z.read('assets/binData/cf.bin'))
          with zipfile.ZipFile('work/CounterFlame_Icon_Crack.apk') as z:
            for name,target in [('classes3.dex','classes3-icon.dex'),('classes4.dex','classes4-icon.dex'),('assets/binData/cf.bin','cf-icon.bin')]:Path('counterflame_android',target).write_bytes(z.read(name))
          PY
      - name: Install verification dependencies
        run: |
          python3 -m venv work/venv
          work/venv/bin/pip install --disable-pip-version-check -r counterflame_android/requirements.txt
          python3 counterflame_android/fetch_host_tools.py work/host-tools
      - name: Verify real DEX authentication, cached login and refresh
        run: |
          python3 counterflame_android/verify_host.py work/host-tools
      - name: Verify native labels and module integrity
        run: |
          work/venv/bin/python counterflame_android/verify_native.py
          python3 counterflame_android/verify_apk.py work/original.apk work/CounterFlame_Icon_Crack.apk --report work/counterflame-android-apk-verification.json
      - name: Verify Android signatures and alignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,subprocess
          signer=sorted((Path(os.environ['ANDROID_HOME'])/'build-tools').glob('*/apksigner'))[-1]
          with Path('work/signature-verification.txt').open('w') as f:subprocess.run([str(signer),'verify','--min-sdk-version','26','--verbose','--print-certs','work/CounterFlame_Icon_Crack.apk'],stdout=f,check=True)
          subprocess.run([str(signer.parent/'zipalign'),'-c','-P','16','4','work/CounterFlame_Icon_Crack.apk'],check=True)
          PY
          unzip -t work/CounterFlame_Icon_Crack.apk | tail -1
      - name: Publish one signed APK
        run: |
          gh release upload counterflame-android-icon-crack-v1 work/CounterFlame_Icon_Crack.apk counterflame_android/SHA256SUMS counterflame_android/auth-verification.json counterflame_android/native-verification.json work/counterflame-android-apk-verification.json work/signature-verification.txt --clobber
          gh release edit counterflame-android-icon-crack-v1 --draft=false --prerelease --title 'CounterFlame Android 1.4.1 — @Icon_Crack' --notes-file counterflame_android/release-notes.md
